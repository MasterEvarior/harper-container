---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint:
    name: "Run linter"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check Linting
        uses: ./.github/actions/just-command
        with:
          command: lint

  build-image:
    name: "Build Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - lint
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build image.tar
        uses: ./.github/actions/just-command
        with:
          command: build
      - name: Upload image.tar
        uses: actions/upload-artifact@v7
        with:
          path: result
          if-no-files-found: error
          retention-days: 1
          archive: false
      - name: Extract image tag
        uses: ./.github/actions/just-command
        with:
          command: tag
      - name: Add image tag to output
        id: tag
        run: echo "tag=$(cat result)" >> "$GITHUB_OUTPUT"
      - name: Add harper version
        uses: ./.github/actions/just-command
        with:
          command: version
      - name: Add version to output
        id: version
        run: echo "version=$(cat result)" >> "$GITHUB_OUTPUT"


  upload-image:
    name: "Upload Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs:
      - build-image
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/masterevarior/harper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: result
      - name: Load Docker Image
        run: docker load < result
      - name: Tag image
        run: docker tag ${{ needs.build-image.outputs.tag }} ${{ env.IMAGE }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.build-image.outputs.version }}
            type=ref,event=tag
            type=sha,format=long,prefix=
            type=raw,value=latest
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and Push Image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_IMAGE: ${{ needs.build-image.outputs.tag }}
        run: |
          for tag in $TAGS; do
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done
